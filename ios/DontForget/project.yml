name: DontForget
options:
  bundleIdPrefix: io.buckleapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer Team ID here (Xcode > Settings > Accounts), e.g. ABCDE12345
    DEVELOPMENT_TEAM: ""

targets:
  DontForget:
    type: application
    platform: iOS
    sources:
      - path: DontForget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.buckleapp.dontforget
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: DontForget/Info.plist
      properties:
        CFBundleDisplayName: Don't Forget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
        NSLocationWhenInUseUsageDescription: >-
          Don't Forget uses your location to know when you are at home,
          so it can remind you about the things you need to take with you.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          "Always" access lets Don't Forget alarm you the moment you leave home
          without something, even when the app is closed. Your location never leaves your device.
        NSCameraUsageDescription: >-
          Take a photo of the item you need to remember, and a photo to confirm you have it.
        NSPhotoLibraryUsageDescription: >-
          Pick a photo of the item you need to remember.
    entitlements:
      path: DontForget/DontForget.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.io.buckleapp.dontforget
        com.apple.developer.usernotifications.time-sensitive: true
